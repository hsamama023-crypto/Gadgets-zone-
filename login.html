<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Gadgets Zone</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.box{background:#111;padding:30px;border-radius:20px;width:90%;max-width:360px;text-align:center;border:1px solid #222}.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:700;margin-top:12px;cursor:pointer}.google{background:#fff;color:#000}.guest{background:#222;color:#fff}</style></head><body><div class="box"><h2>Gadget<span style="color:#f85606">Zone</span></h2><p style="color:#aaa;font-size:12px;margin:10px 0 20px">Login to Continue</p>
<button class="btn google" onclick="login()">Continue with Google</button>
<button class="btn guest" onclick="guestLogin()">Continue as Guest</button></div>
<script>
function login(){let n=prompt("Naam likho:");let e=prompt("Email:");if(n){localStorage.setItem('gz_user', JSON.stringify({name:n,email:e})); location.href="index.html";}}
function guestLogin(){localStorage.setItem('gz_user','guest'); location.href="index.html";}
</script></body></html>
