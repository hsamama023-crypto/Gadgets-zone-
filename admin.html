<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetZone Admin - Black</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script>
// 🔒 LOCK - Password Check
let pass = prompt("🔒 Admin Password Likho:");
if(pass !== "gadgets 0827"){
  alert("❌ Ghalat Password");
  window.location.href = "index.html";
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:white;min-height:100vh;padding:15px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-weight:700;font-size:20px}
.logo span{color:#00d4ff}
.box{background:#111;border:1px solid #222;border-radius:20px;padding:20px;max-width:420px;margin:0 auto 20px auto}
.title{font-weight:700;font-size:16px;margin-bottom:15px}
input{width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid #333;background:#000;color:white;outline:none;font-size:14px}
input:focus{border-color:#00d4ff}
.preview{width:100%;height:200px;background:#000;border:1px dashed #333;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:10px 0;color:#555;font-size:12px}
.preview img{width:100%;height:100%;object-fit:contain}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:14px;margin-top:10px;cursor:pointer}
.btn-save{background:#00d4ff;color:black}
.btn-shop{background:white;color:black}
.products{max-width:420px;margin:0 auto}
.p-card{background:#111;border:1px solid #222;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.p-card img{width:55px;height:55px;border-radius:10px;background:#000;object-fit:contain}
.p-info{flex:1}
.p-name{font-size:13px;color:#eee}
.p-price{font-size:12px;color:#00d4ff;font-weight:600}
.del-btn{background:#ff1a1a;color:white;border:none;padding:6px 12px;border-radius:8px;font-size:12px}
</style>
</head>
<body>

<div class="top">
  <div class="logo">Gadget<span>Zone</span> <span style="font-size:10px;color:#666;font-weight:400">ADMIN</span></div>
  <button onclick="location.href='index.html'" style="background:#1a1a1a;color:white;border:1px solid #333;padding:7px 14px;border-radius:20px;font-size:12px">Shop Dekho →</button>
</div>

<div class="box">
  <div class="title">➕ Naya Product Add Karo</div>
  <input id="pName" placeholder="Product Name - ex: Ronnin R-690">
  <input id="pPrice" type="number" placeholder="Price - ex: 6000">
  
  <div style="font-size:11px;color:#888;margin-top:10px">📸 Gallery se Photo Chuno:</div>
  <input type="file" id="pFile" accept="image/*">
  
  <div class="preview" id="previewBox">Photo yahan dikhegi</div>
  
  <button class="btn btn-save" onclick="saveProduct()">✅ Save Product</button>
  <button class="btn btn-shop" onclick="location.href='index.html'">🛒 Shop Dekho</button>
</div>

<div class="products">
  <div style="font-size:13px;color:#888;margin-bottom:10px">📦 Saved Products (<span id="count">0</span>)</div>
  <div id="list"></div>
</div>

<script>
let gadgets = JSON.parse(localStorage.getItem('myGadgets') || '[]');
let base64Img = "";

document.getElementById('pFile').addEventListener('change', function(e){
  let file = e.target.files[0];
  if(!file) return;
  let reader = new FileReader();
  reader.onload = function(ev){
    base64Img = ev.target.result;
    document.getElementById('previewBox').innerHTML = `<img src="${base64Img}">`;
  };
  reader.readAsDataURL(file);
});

function saveProduct(){
  let name = document.getElementById('pName').value.trim();
  let price = document.getElementById('pPrice').value.trim();
  if(!name || !price){ alert("❌ Name aur Price likho"); return; }
  if(!base64Img){ alert("❌ Gallery se photo chuno"); return; }
  
  gadgets.push({name:name, price:price, img:base64Img});
  localStorage.setItem('myGadgets', JSON.stringify(gadgets));
  alert("✅ Product Add Ho Gaya!");
