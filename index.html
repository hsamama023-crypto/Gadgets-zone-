<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetZone - Pakistan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f85606">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f5f5;color:#222}
header{background:#000;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.logo{font-size:20px;font-weight:700;color:#00e5c0;display:flex;align-items:center;gap:6px;cursor:pointer}
.logo span{color:#fff}
.search{flex:1;margin:0 10px}
.search input{width:100%;padding:8px 12px;border-radius:20px;border:none;outline:none;background:#222;color:#fff;font-size:12px}
.icons{display:flex;gap:12px;font-size:20px;cursor:pointer}
#appBanner{background:#f85606;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;font-weight:600}
#appBanner button{background:#fff;color:#f85606;border:none;padding:6px 14px;border-radius:20px;font-weight:800;cursor:pointer}
.slider-wrap{height:160px;overflow:hidden;position:relative;margin:10px;border-radius:12px;background:#000}
.slide{position:absolute;width:100%;height:100%;display:flex;align-items:center;padding:0 20px;color:#fff;opacity:0;transition:0.6s}
.slide.active{opacity:1}
.slide h2{font-size:18px}.slide p{font-size:11px;opacity:0.8}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
.cat{background:#fff;border:1px solid #eee;padding:6px 14px;border-radius:20px;font-size:11px;white-space:nowrap;cursor:pointer}
.cat.active{background:#000;color:#fff}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 10px 80px}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee}
.card-img{height:140px;background:#fafafa;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:8px}.card-body h3{font-size:11px;height:32px;overflow:hidden}
.price{color:#f85606;font-weight:700;font-size:13px}
.old{font-size:10px;color:#999;text-decoration:line-through}
@media(min-width:768px){
  header{padding:14px 30px}.logo{font-size:26px}
  .products{grid-template-columns:repeat(4,1fr);gap:14px;padding:20px 30px;max-width:1400px;margin:0 auto}
  .slider-wrap{height:300px;margin:16px 30px}
  .card-img{height:220px}
}
#cartDrawer,#wishDrawer{position:fixed;top:0;right:-100%;width:90%;max-width:380px;height:100%;background:#fff;z-index:100;transition:0.3s;padding:14px;overflow-y:auto}
#cartDrawer.open,#wishDrawer.open{right:0}
#addBox{display:none;background:#111;color:#fff;padding:14px;border-radius:12px;margin:10px}
#addBox input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:8px 0;z-index:40}
.bottom-nav div{font-size:10px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo" id="logoBtn">⚡Gadget<span>Zone</span></div>
<div class="search"><input id="searchInput" placeholder="Search earbuds, watches..."></div>
<div class="icons"><span id="wishBtn">♡</span><span id="cartBtn">🛒 <b id="cartCount" style="font-size:11px;background:#f85606;color:#fff;border-radius:10px;padding:0 5px">0</b></span></div>
</header>
<div id="appBanner">
<span>📱 Get GadgetZone App - 60% OFF</span>
<div><button onclick="downloadApp()">⬇️ Download APK</button> <span onclick="closeAppBanner()" style="margin-left:10px;cursor:pointer">✕</span></div>
</div>
<div class="slider-wrap">
<div class="slide active" style="background:linear-gradient(90deg,#0f2027,#203a43)"><div><h2>UPTO 60% OFF</h2><p>On Headphones & More</p></div></div>
<div class="slide" style="background:linear-gradient(90deg,#ff512f,#dd2476)"><div><h2>FREE DELIVERY</h2><p>All Pakistan</p></div></div>
</div>
<div class="cats" id="cats"></div>
<div class="products" id="products"></div>
<div id="cartDrawer"><span style="float:right;cursor:pointer" onclick="closeCart()">✕</span><h3>🛒 My Cart</h3><div id="cartItems" style="margin-top:14px"></div><div id="cartTotal" style="font-weight:800;margin-top:10px"></div><button onclick="checkout()" style="width:100%;background:#f85606;color:#fff;padding:12px;border:none;border-radius:10px;margin-top:10px;font-weight:700">Checkout on WhatsApp</button></div>
<div id="wishDrawer"><span style="float:right;cursor:pointer" onclick="closeWish()">✕</span><h3>♡ Wishlist</h3><div id="wishItems"></div></div>

<div id="addBox">
<h3>🔓 Admin Panel</h3>
<input id="ownerNumber" placeholder="WhatsApp 923...">
<input id="appLink" value="https://github.com/hsamama023-crypto/Gadgets-zone-/raw/main/GadgetZone.apk">
<input id="pName" placeholder="Product Name">
<div style="display:flex;gap:6px"><input id="pPrice" type="number" placeholder="New Price"><input id="pOldPrice" type="number" placeholder="Old Price 9750"></div>
<input id="pCat" placeholder="Category Earbuds, Watch">
<input type="file" id="pFile" accept="image/*" multiple>
<div id="pv" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"></div>
<button onclick="saveProduct()" id="saveBtn" style="background:#f85606;color:#fff;width:100%;padding:10px;border:none;border-radius:8px;font-weight:700">✅ Save & Make LIVE</button>
<button onclick="saveSettings()" style="background:#222;color:#fff;border:1px solid #444;width:100%;padding:10px;border-radius:8px;margin-top:6px">💾 Save WhatsApp + App Link</button>
<p style="font-size:10px;margin-top:8px;color:#aaa">App Link me APK ka link already dala hua hai - Save dabao bas.</p>
</div>

<div class="bottom-nav"><div onclick="window.scrollTo(0,0)">🏠<br>Home</div><div onclick="document.getElementById('cats').scrollIntoView()">📦<br>Categories</div><div id="bottomCart">🛒<br>Cart</div><div onclick="openWish()">♡<br>Wishlist</div><div onclick="document.getElementById('logoBtn').click()">👤<br>Admin</div></div>
<script>
let gadgets=JSON.parse(localStorage.getItem('myGadgets')||'[]');
let cart=JSON.parse(localStorage.getItem('gz_cart')||'[]');
let deferredPrompt=null; let tapCount=0;
const DEFAULT_APK = "https://github.com/hsamama023-crypto/Gadgets-zone-/raw/main/GadgetZone.apk";

// ===== DOWNLOAD FIX - NO POPUP =====
function downloadApp(){
  let link = localStorage.getItem('gz_appLink') || DEFAULT_APK;
  if(!link || link.trim()=="") link = DEFAULT_APK;
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{deferredPrompt=null;});
    return;
  }
  // direct download
  let a=document.createElement('a');
  a.href=link; a.target="_blank"; a.download="GadgetZone.apk";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>{ window.open(link,'_blank'); },300);
  closeAppBanner();
}
function closeAppBanner(){
  let b=document.getElementById('appBanner'); if(b) b.style.display='none';
  localStorage.setItem('appBannerClosed','1');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
if(localStorage.getItem('appBannerClosed')=='1') document.getElementById('appBanner').style.display='none';

// Products
function renderCats(){
  let cats=['All',...new Set(gadgets.map(g=>g.cat))];
  document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${c=='All'?'active':''}" onclick="filterCat('${c}',this)">${c}</div>`).join('');
}
let currentCat='All';
function filterCat(c,el){currentCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');renderProducts();}
function renderProducts(){
  let q=document.getElementById('searchInput').value.toLowerCase();
  let list=gadgets.filter(g=>(currentCat=='All'||g.cat==currentCat)&&g.name.toLowerCase().includes(q));
  document.getElementById('products').innerHTML=list.map((g,i)=>`
  <div class="card"><div class="card-img"><img src="${g.img||g.imgs?.[0]||''}"></div>
  <div class="card-body"><h3>${g.name}</h3><div class="price">Rs. ${g.price} <span class="old">Rs.${g.oldPrice||'9750'}</span></div>
  <button onclick="addToCart(${i})" style="width:100%;margin-top:6px;background:#000;color:#fff;border:none;padding:6px;border-radius:6px;font-size:11px">Add to Cart</button></div></div>`).join('')||'<p style="padding:20px">No Products</p>';
}
function addToCart(i){cart.push(gadgets[i]);localStorage.setItem('gz_cart',JSON.stringify(cart));updateCartCount();alert('Added');}
function updateCartCount(){document.getElementById('cartCount').innerText=cart.length;}
function openCart(){document.getElementById('cartDrawer').classList.add('open');document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div style="border-bottom:1px solid #eee;padding:8px 0">${c.name} - Rs.${c.price} <span onclick="cart.splice(${i},1);localStorage.setItem('gz_cart',JSON.stringify(cart));openCart();updateCartCount()" style="color:red;cursor:pointer"> Remove</span></div>`).join('');let t=cart.reduce((s,c)=>s+parseInt(c.price||0),0);document.getElementById('cartTotal').innerText='Total: Rs.'+t;}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');}
function openWish(){document.getElementById('wishDrawer').classList.add('open');}
function closeWish(){document.getElementById('wishDrawer').classList.remove('open');}
function checkout(){let wa=localStorage.getItem('ownerWA')||'923000000000';let t=cart.reduce((s,c)=>s+parseInt(c.price||0),0);let msg=`*New Order*%0A`+cart.map(c=>`• ${c.name} Rs.${c.price}`).join('%0A')+`%0ATotal: Rs.${t}`;window.open(`https://wa.me/${wa}?text=${msg}`,'_blank');}
document.getElementById('searchInput').addEventListener('input',renderProducts);
document.getElementById('cartBtn').onclick=openCart;document.getElementById('bottomCart').onclick=openCart;document.getElementById('wishBtn').onclick=openWish;
document.getElementById('logoBtn').addEventListener('click',()=>{tapCount++;setTimeout(()=>tapCount=0,800);if(tapCount>=2){let p=prompt('Password:');if(p=='gadgets 0827'){document.getElementById('addBox').style.display='block';loadAdmin();}tapCount=0;}});
let imgDatas=[];
function compressImage(f){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let max=1000;let w=img.width,h=img.height;if(w>h){if(w>max){h*=max/w;w=max;}}else{if(h>max){w*=max/h;h=max;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.78));};img.src=e.target.result;};r.readAsDataURL(f);});}
document.getElementById('pFile').addEventListener('change',async e=>{let files=[...e.target.files].slice(0,5);imgDatas=[];document.getElementById('pv').innerHTML='⏳...';for(let f of files){let d=await compressImage(f);imgDatas.push(d);}document.getElementById('pv').innerHTML=imgDatas.map(d=>`<img src="${d}" style="width:50px;height:50px;object-fit:cover;border-radius:6px">`).join('');});
function loadAdmin(){let o=localStorage.getItem('ownerWA');let a=localStorage.getItem('gz_appLink')||DEFAULT_APK;if(o)document.getElementById('ownerNumber').value=o;document.getElementById('appLink').value=a;}
function saveSettings(){let o=document.getElementById('ownerNumber').value;let a=document.getElementById('appLink').value||DEFAULT_APK;if(o)localStorage.setItem('ownerWA',o);localStorage.setItem('gz_appLink',a);alert('✅ Saved! Ab APK download hoga');}
async function saveProduct(){let n=document.getElementById('pName').value,pr=document.getElementById('pPrice').value,oldPr=document.getElementById('pOldPrice').value||'9750',ct=document.getElementById('pCat').value||'Gadgets';if(!n||!pr||imgDatas.length==0){alert('Name Price Photo bharo');return;}gadgets.unshift({name:n,price:pr,oldPrice:oldPr,cat:ct,rating:'4.5',reviews:'120',imgs:imgDatas,img:imgDatas[0]});localStorage.setItem('myGadgets',JSON.stringify(gadgets));renderCats();renderProducts();alert('✅ LIVE!');}
fetch('products.json').then(r=>r.json()).then(j=>{if(j.length>gadgets.length){gadgets=j;localStorage.setItem('myGadgets',JSON.stringify(j));}renderCats();renderProducts();updateCartCount();}).catch(()=>{renderCats();renderProducts();updateCartCount();});
</script>
</body>
</html>
