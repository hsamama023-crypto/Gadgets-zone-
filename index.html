<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetZone - Premium Black Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
::-webkit-scrollbar{width:0}
/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px} .logo span{color:#00d4ff}
.h-icons{display:flex;gap:12px;align-items:center}
.icon{width:38px;height:38px;background:#111;border:1px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:#00d4ff;color:#000;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
/* SEARCH */
.search-wrap{padding:12px 16px}
.search{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #222;border-radius:14px;padding:12px 16px}
.search input{background:transparent;border:none;outline:none;color:white;width:100%;font-size:14px}
/* CATEGORIES */
.cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;white-space:nowrap}
.cat{padding:8px 16px;border-radius:20px;background:#111;border:1px solid #222;font-size:12px;font-weight:600;flex-shrink:0}
.cat.active{background:#fff;color:#000;border-color:#fff}
/* HERO */
.hero{margin:0 16px;background:linear-gradient(135deg,#111 0%,#1a1a1a 50%,#000 100%);border:1px solid #222;border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(0,212,255,0.15),transparent);border-radius:50%}
.hero h2{font-size:15px;font-weight:700} .hero p{font-size:11px;color:#888;margin-top:4px}
.hero-btn{background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:700;border:none;margin-top:10px}
/* PRODUCTS */
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:12px;position:relative;transition:.2s}
.card:active{transform:scale(.97)}
.card-img{width:100%;height:150px;background:#0a0a0a;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img img{width:90%;height:90%;object-fit:contain}
.card-badge{position:absolute;top:8px;left:8px;background:#00d4ff;color:#000;font-size:9px;font-weight:800;padding:3px 8px;border-radius:10px}
.card-del{display:none;position:absolute;top:8px;right:8px;background:red;color:white;border:none;width:24px;height:24px;border-radius:50%;z-index:2}
.card-del.show{display:block}
.name{font-size:12.5px;font-weight:600;margin-top:10px;line-height:1.3;height:36px;overflow:hidden;color:#eee}
.rating{font-size:10px;color:#888;margin:4px 0} .rating span{color:#ffcc00}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{color:#00d4ff;font-weight:800;font-size:15px} .old{font-size:10px;color:#555;text-decoration:line-through;margin-left:4px}
.add-cart{width:32px;height:32px;background:#fff;color:#000;border:none;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* CART DRAWER */
#cartDrawer{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100vh;background:#0a0a0a;border-left:1px solid #222;z-index:200;transition:.35s;padding:16px;overflow-y:auto}
#cartDrawer.open{right:0}
.cart-item{background:#111;border:1px solid #222;border-radius:14px;padding:10px;display:flex;gap:10px;margin-bottom:10px;align-items:center}
.cart-item img{width:50px;height:50px;background:#000;border-radius:10px;object-fit:contain}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:22px;height:22px;border-radius:50%;border:1px solid #333;background:#000;color:white}
/* ADMIN */
#adminBar{display:none;background:#00d4ff;color:#000;text-align:center;padding:8px;font-size:11px;font-weight:700;position:sticky;top:62px;z-index:99}
#adminBar.show{display:block}
#addBox{display:none;background:#111;border:1px solid #00d4ff;border-radius:18px;padding:16px;margin:16px}
#addBox.show{display:block}
#addBox input{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #333;background:#000;color:white}
.fab{display:none;position:fixed;bottom:20px;right:20px;background:#00d4ff;color:#000;width:58px;height:58px;border-radius:50%;border:none;font-size:28px;font-weight:800;box-shadow:0 0 25px rgba(0,212,255,.5);z-index:50}
.fab.show{display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:60px 20px;color:#444;grid-column:1/3}
</style>
</head>
<body>

<div id="adminBar">🔓 ADMIN MODE - Add / Delete Active</div>

<header>
  <div class="logo" id="logoBtn">Gadget<span>Zone</span></div>
  <div class="h-icons">
    <div class="icon" onclick="openCart()">🛒<div class="badge" id="cartCount">0</div></div>
  </div>
</header>

<div class="search-wrap"><div class="search">🔍<input id="searchInput" placeholder="Search Ronnin, Audionic, Watch..." oninput="filterProducts()"></div></div>

<div class="cats" id="cats">
  <div class="cat active" onclick="setCat('All',this)">All</div>
  <div class="cat" onclick="setCat('Earbuds',this)">Earbuds</div>
  <div class="cat" onclick="setCat('Watch',this)">Watches</div>
  <div class="cat" onclick="setCat('Speaker',this)">Speakers</div>
  <div class="cat" onclick="setCat('Power',this)">PowerBank</div>
</div>

<div class="hero">
  <div><h2>⚡ Free Delivery Gujranwala</h2><p>Original Gadgets • COD • 7 Days Return</p><button class="hero-btn" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now →</button></div>
  <div style="font-size:36px">🎧</div>
</div>

<!-- ADMIN ADD BOX -->
<div id="addBox">
  <div style="font-weight:700;font-size:14px;margin-bottom:8px">➕ Add New Gadget</div>
  <input id="pName" placeholder="Name - Ronnin R-690 EarBuds">
  <input id="pPrice" type="number" placeholder="Price - 4500">
  <input id="pCat" placeholder="Category - Earbuds / Watch">
  <input type="file" id="pFile" accept="image/*" style="color:#888">
  <div id="pv" style="text-align:center;margin:8px 0"></div>
  <button onclick="saveProduct()" style="width:100%;padding:12px;background:#00d4ff;color:#000;border:none;border-radius:12px;font-weight:800">✅ Add to Shop</button>
  <p id="msg" style="text-align:center;font-size:11px;color:#00d4ff;margin-top:6px"></p>
</div>

<div class="products" id="products"></div>

<button class="fab" id="fabBtn" onclick="toggleAdd()">+</button>

<!-- CART DRAWER -->
<div id="cartDrawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h3 style="font-size:16px">🛒 My Cart (<span id="cartNum">0</span>)</h3>
    <button onclick="closeCart()" style="background:#111;border:1px solid #333;color:white;width:30px;height:30px;border-radius:50%">✕</button>
  </div>
  <div id="cartItems"></div>
  <div id="cartTotal" style="margin-top:16px;padding-top:16px;border-top:1px solid #222"></div>
</div>

<script>
// ===== DATA =====
let gadgets = JSON.parse(localStorage.getItem('myGadgets')||'[]');
// Demo products if empty first time
if(gadgets.length==0){
  gadgets=[
    {name:"Ronnin R-690 Wireless EarBuds",price:"4999",cat:"Earbuds",img:"https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"},
    {name:"T800 Ultra Smart Watch Black",price:"2999",cat:"Watch",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"},
    {name:"Audionic Max Pro Speaker",price:"3500",cat:"Speaker",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400"}
  ];
  localStorage.setItem('myGadgets',JSON.stringify(gadgets));
}
let cart = JSON.parse(localStorage.getItem('myCart')||'[]');
let currentCat='All', searchQ='', admin=false, imgData='', tap=0;

// ===== ADMIN SECRET: Logo 5x Tap =====
document.getElementById('logoBtn').addEventListener('click',()=>{
  tap++; if(tap>=5){
    let p=prompt("Admin Password:");
    if(p==="gadgets 0827"){
      admin=!admin;
      document.getElementById('adminBar').classList.toggle('show',admin);
      document.getElementById('fabBtn').classList.toggle('show',admin);
      if(admin) document.getElementById('addBox').classList.add('show');
      else document.getElementById('addBox').classList.remove('show');
      render();
      alert(admin?"✅ Admin ON - Add/Delete kar sakte ho":"🔒 Admin OFF");
    }else if(p!==null) alert("❌ Wrong");
    tap=0;
  } setTimeout(()=>tap=0,3000);
});
function toggleAdd(){document.getElementById('addBox').classList.toggle('show');}

// ===== IMAGE UPLOAD =====
document.getElementById('pFile').addEventListener('change',e=>{
  let file=e.target.files[0]; if(!file) return;
  if(file.size>900000){document.getElementById('msg').innerText="⚠️ Image 900KB se chhoti chuno";return;}
  let r=new FileReader();
  r.onload=ev=>{imgData=ev.target.result; document.getElementById('pv').innerHTML=`<img src="${imgData}" style="max-height:100px;border-radius:10px"><br><span style="color:lime;font-size:10px">✅ Ready</span>`;};
  r.readAsDataURL(file);
});

function saveProduct(){
  let n=document.getElementById('pName').value.trim(), pr=document.getElementById('pPrice').value.trim(), ct=document.getElementById('pCat').value.trim()||'Earbuds';
  if(!n||!pr){document.getElementById('msg').innerText="❌ Name Price likho";return;}
  if(!imgData){document.getElementById('msg').innerText="❌ Photo chuno";return;}
  try{
    gadgets.unshift({name:n,price:pr,cat:ct,img:imgData});
    localStorage.setItem('myGadgets',JSON.stringify(gadgets));
    document.getElementById('msg').innerText="✅ Added!";
    document.getElementById('pName').value="";document.getElementById('pPrice').value="";document.getElementById('pCat').value="";document.getElementById('pv').innerHTML="";imgData="";
    render();
  }catch(e){document.getElementById('msg').innerText="Storage Full: "+e.message;}
}

// ===== RENDER PRODUCTS =====
function render(){
  let list = gadgets.filter(g=>{
    let mCat = currentCat=='All' || (g.cat||'').toLowerCase().includes(currentCat.toLowerCase()) || g.name.toLowerCase().includes(currentCat.toLowerCase());
    let mSearch = g.name.toLowerCase().includes(searchQ);
    return mCat && mSearch;
  });
  let box=document.getElementById('products');
  if(list.length==0){box.innerHTML=`<div class="empty">No Products Found<br><span style="font-size:11px">Try All category</span></div>`;return;}
  box.innerHTML=list.map((g,idx)=>{
    let realIdx=gadgets.indexOf(g);
    return `<div class="card">
      <button class="card-del ${admin?'show':''}" onclick="delP(${realIdx})">✕</button>
      <div class="card-img"><div class="card-badge">HOT</div><img src="${g.img}" onerror="this.src='https://via.placeholder.com/200'"></div>
      <div class="name">${g.name}</div>
      <div class="rating"><span>★★★★★</span> 4.8 (120)</div>
      <div class="price-row"><div><span class="price">Rs. ${g.price}</span><span class="old">Rs. ${Math.round(+g.price*1.4)}</span></div><button class="add-cart" onclick="addToCart(${realIdx})">+</button></div>
    </div>`;
  }).join('');
}
function setCat(c,el){currentCat=c; document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render();}
function filterProducts(){searchQ=document.getElementById('searchInput').value.toLowerCase(); render();}
function delP(i){if(confirm("Delete?")){gadgets.splice(i,1);localStorage.setItem('myGadgets',JSON.stringify(gadgets));render();}}

// ===== CART =====
function addToCart(i){
  let ex=cart.find(c=>c.name===gadgets[i].name);
  if(ex) ex.qty++; else cart.push({...gadgets[i],qty:1});
  localStorage.setItem('myCart',JSON.stringify(cart));
  updateCart(); 
  // animation
  let b=document.getElementById('cartCount'); b.style.transform='scale(1.5)'; setTimeout(()=>b.style.transform='scale(1)',200);
}
function updateCart(){
  document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cartNum').innerText=cart.reduce((a,b)=>a+b.qty,0);
  let box=document.getElementById('cartItems');
  if(cart.length==0){box.innerHTML=`<p style="text-align:center;color:#555;padding:40px">Cart Empty</p>`; document.getElementById('cartTotal').innerHTML=""; return;}
  box.innerHTML=cart.map((c,i)=>`
    <div class="cart-item">
      <img src="${c.img}"><div style="flex:1"><div style="font-size:12px">${c.name}</div><div style="font-size:12px;color:#00d4ff">Rs. ${c.price}</div>
      <div class="qty"><button onclick="chgQty(${i},-1)">-</button><span>${c.qty}</span><button onclick="chgQty(${i},1)">+</button><button onclick="remCart(${i})" style="margin-left:10px;color:red;border:none;background:transparent">Remove</button></div></div>
    </div>`).join('');
  let total=cart.reduce((a,b)=>a+(+b.price*b.qty),0);
  document.getElementById('cartTotal').innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:14px"><span>Subtotal</span><span>Rs. ${total}</span></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#888;margin:6px 0"><span>Delivery</span><span style="color:#00d4ff">FREE</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-top:10px"><span>Total</span><span style="color:#00d4ff">Rs. ${total}</span></div>
    <button onclick="checkout()" style="width:100%;padding:14px;background:#00d4ff;color:#000;border:none;border-radius:12px;font-weight:800;margin-top:14px">✅ Checkout via WhatsApp</button>
    <button onclick="clearCart()" style="width:100%;padding:10px;background:transparent;color:#666;border:1px solid #222;border-radius:12px;margin-top:8px;font-size:12px">Clear Cart</button>`;
}
function chgQty(i,d){cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function remCart(i){cart.splice(i,1); localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function clearCart(){cart=[]; localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function openCart(){document.getElementById('cartDrawer').classList.add('open'); updateCart();}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');}
function checkout(){
  let total=cart.reduce((a,b)=>a+(+b.price*b.qty),0);
  let text=`*GadgetZone Order*%0A%0A${cart.map(c=>`• ${c.name} x${c.qty} = Rs.${c.price*c.qty}`).join('%0A')}%0A%0A*Total: Rs. ${total}*%0A%0AName:%0AAddress:%0APhone:`;
  window.open(`https://wa.me/923000000000?text=${text}`,'_blank');
}
updateCart(); render();
</script>
</body>
</html>
