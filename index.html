<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetZone - Premium Black Store</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:#fff;overflow-x:hidden}
header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px} .logo span{color:#00d4ff}
.icon{width:38px;height:38px;background:#111;border:1px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:#00d4ff;color:#000;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search-wrap{padding:12px 16px}
.search{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #222;border-radius:14px;padding:12px 16px}
.search input{background:transparent;border:none;outline:none;color:white;width:100%;font-size:14px}
.cats{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;white-space:nowrap}
.cat{padding:8px 16px;border-radius:20px;background:#111;border:1px solid #222;font-size:12px;font-weight:600;flex-shrink:0}
.cat.active{background:#fff;color:#000}
.hero{margin:0 16px;background:linear-gradient(135deg,#111 0%,#1a1a1a 50%,#000 100%);border:1px solid #222;border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:12px;position:relative}
.card-img{width:100%;height:150px;background:#0a0a0a;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:pointer}
.card-img img{width:90%;height:90%;object-fit:contain}
.card-badge{position:absolute;top:8px;left:8px;background:#00d4ff;color:#000;font-size:9px;font-weight:800;padding:3px 8px;border-radius:10px}
.card-del{display:none;position:absolute;top:8px;right:8px;background:red;color:white;border:none;width:24px;height:24px;border-radius:50%;z-index:2}
.card-del.show{display:block}
.dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;background:#444}
.dot.active{background:#00d4ff}
.name{font-size:12.5px;font-weight:600;margin-top:10px;height:36px;overflow:hidden;color:#eee}
.price-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.price{color:#00d4ff;font-weight:800;font-size:15px} .old{font-size:10px;color:#555;text-decoration:line-through;margin-left:4px}
.add-cart{width:32px;height:32px;background:#fff;color:#000;border:none;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
#cartDrawer{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100vh;background:#0a0a0a;border-left:1px solid #222;z-index:200;transition:.35s;padding:16px;overflow-y:auto}
#cartDrawer.open{right:0}
.cart-item{background:#111;border:1px solid #222;border-radius:14px;padding:10px;display:flex;gap:10px;margin-bottom:10px;align-items:center}
.cart-item img{width:50px;height:50px;background:#000;border-radius:10px;object-fit:contain}
.qty{display:flex;align-items:center;gap:8px;margin-top:4px}
.qty button{width:22px;height:22px;border-radius:50%;border:1px solid #333;background:#000;color:white}
#adminBar{display:none;background:#00d4ff;color:#000;text-align:center;padding:8px;font-size:11px;font-weight:700;position:sticky;top:62px;z-index:99}
#adminBar.show{display:block}
#addBox{display:none;background:#111;border:1px solid #00d4ff;border-radius:18px;padding:16px;margin:16px}
#addBox.show{display:block}
#addBox input{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #333;background:#000;color:white}
.fab{display:none;position:fixed;bottom:20px;right:20px;background:#00d4ff;color:#000;width:58px;height:58px;border-radius:50%;border:none;font-size:28px;font-weight:800;z-index:50}
.fab.show{display:flex;align-items:center;justify-content:center}
#gallery{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,0.95);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#gallery.open{display:flex}
#gallery img{max-width:95%;max-height:70vh;object-fit:contain;border-radius:14px}
.g-thumb{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
.g-thumb img{width:60px;height:60px;border-radius:10px;border:2px solid #222;object-fit:cover;opacity:0.5}
.g-thumb img.active{border-color:#00d4ff;opacity:1}
.empty{text-align:center;padding:60px 20px;color:#444;grid-column:1/3}
</style>
</head>
<body>
<div id="adminBar">🔓 ADMIN MODE - 6 Photos LIVE</div>
<header><div class="logo" id="logoBtn">Gadget<span>Zone</span></div><div class="icon" onclick="openCart()">🛒<div class="badge" id="cartCount">0</div></div></header>
<div class="search-wrap"><div class="search">🔍<input id="searchInput" placeholder="Search..." oninput="filterProducts()"></div></div>
<div class="cats" id="cats"><div class="cat active" onclick="setCat('All',this)">All</div><div class="cat" onclick="setCat('Earbuds',this)">Earbuds</div><div class="cat" onclick="setCat('Watch',this)">Watches</div><div class="cat" onclick="setCat('Speaker',this)">Speakers</div><div class="cat" onclick="setCat('Power',this)">PowerBank</div></div>
<div class="hero"><div><h2>⚡ Free Delivery Gujranwala</h2><p>Original Gadgets • COD • 7 Days Return</p></div><div style="font-size:36px">🎧</div></div>

<div id="addBox">
  <div style="font-weight:700;font-size:14px;margin-bottom:8px">➕ Add Gadget (6 Photos)</div>
  <input id="pName" placeholder="Name"><input id="pPrice" type="number" placeholder="Price"><input id="pCat" placeholder="Category">
  <input type="file" id="pFile" accept="image/*" multiple>
  <p style="font-size:10px;color:#888">6 photos ek sath select karo (Ctrl+A)</p>
  <div id="pv" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0"></div>
  <button onclick="saveProduct()" id="saveBtn" style="width:100%;padding:12px;background:#00d4ff;color:#000;border:none;border-radius:12px;font-weight:800">✅ Save & Make LIVE (6 Photos)</button>
  <p id="msg" style="text-align:center;font-size:11px;color:#00d4ff;margin-top:6px"></p>
</div>

<div class="products" id="products"><div class="empty">Loading LIVE Products...</div></div>
<button class="fab" id="fabBtn" onclick="toggleAdd()">+</button>

<div id="cartDrawer"><div style="display:flex;justify-content:space-between"><h3>🛒 My Cart (<span id="cartNum">0</span>)</h3><button onclick="closeCart()" style="background:#111;border:1px solid #333;color:white;width:30px;height:30px;border-radius:50%">✕</button></div><div id="cartItems"></div><div id="cartTotal" style="margin-top:16px;padding-top:16px;border-top:1px solid #222"></div></div>

<div id="gallery" onclick="closeGallery()"><div style="position:absolute;top:16px;right:16px;background:#111;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center">✕</div><img id="gMain" src=""><div style="color:#888;font-size:12px;margin-top:8px" id="gCounter"></div><div class="g-thumb" id="gThumbs"></div></div>

<script>
const REPO_OWNER="hsamama023-crypto"; const REPO_NAME="Gadgets-zone-"; const FILE_PATH="products.json";
let gadgets=[], cart=JSON.parse(localStorage.getItem('myCart')||'[]'), currentCat='All', searchQ='', admin=false, imgDatas=[], tap=0, gIndex=0, gList=[];

async function loadProducts(){
  try{let res=await fetch(`./${FILE_PATH}?v=${Date.now()}`); if(res.ok){let data=await res.json(); if(Array.isArray(data)&&data.length>0){gadgets=data; localStorage.setItem('myGadgets',JSON.stringify(gadgets)); render(); return;}}}catch(e){}
  gadgets=JSON.parse(localStorage.getItem('myGadgets')||'[]');
  if(gadgets.length==0){gadgets=[{name:"Ronnin R-690 Wireless EarBuds",price:"4999",cat:"Earbuds",imgs:["https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400"]}];}
  render();
}

document.getElementById('logoBtn').addEventListener('click',()=>{tap++; if(tap>=5){let p=prompt("Admin Password:"); if(p==="gadgets 0827"){admin=!admin; document.getElementById('adminBar').classList.toggle('show',admin); document.getElementById('fabBtn').classList.toggle('show',admin); if(admin) document.getElementById('addBox').classList.add('show'); else document.getElementById('addBox').classList.remove('show'); if(admin&&!localStorage.getItem('gh_token')){let t=prompt("GitHub Token dalo (ek bar):"); if(t) localStorage.setItem('gh_token',t.trim());} render(); alert(admin?"✅ Admin ON - 6 photos add kar sakte ho":"🔒 Admin OFF");}else if(p!==null) alert("❌ Wrong"); tap=0;} setTimeout(()=>tap=0,3000);});
function toggleAdd(){document.getElementById('addBox').classList.toggle('show');}

document.getElementById('pFile').addEventListener('change', async e=>{
  let files=[...e.target.files].slice(0,6); imgDatas=[]; document.getElementById('pv').innerHTML="Loading...";
  for(let f of files){
    if(f.size>800000) continue;
    let data=await new Promise(r=>{let fr=new FileReader(); fr.onload=ev=>r(ev.target.result); fr.readAsDataURL(f);});
    imgDatas.push(data);
  }
  document.getElementById('pv').innerHTML=imgDatas.map(d=>`<img src="${d}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #00d4ff">`).join('')+`<br><span style="color:lime;font-size:10px">✅ ${imgDatas.length} Photos Ready</span>`;
});

async function saveProduct(){
  let n=document.getElementById('pName').value.trim(), pr=document.getElementById('pPrice').value.trim(), ct=document.getElementById('pCat').value.trim()||'Earbuds';
  if(!n||!pr){document.getElementById('msg').innerText="❌ Name Price likho";return;}
  if(imgDatas.length==0){document.getElementById('msg').innerText="❌ Photo chuno (1-6)";return;}
  let btn=document.getElementById('saveBtn'); btn.innerText="⏳ LIVE kar raha hun..."; btn.disabled=true;
  try{
    gadgets.unshift({name:n,price:pr,cat:ct,imgs:imgDatas,img:imgDatas[0]});
    localStorage.setItem('myGadgets',JSON.stringify(gadgets));
    let token=localStorage.getItem('gh_token');
    if(token){
      let shaRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{Authorization:`token ${token}`}});
      let sha=null; if(shaRes.ok){let j=await shaRes.json(); sha=j.sha;}
      let content=btoa(unescape(encodeURIComponent(JSON.stringify(gadgets,null,2))));
      let putRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:"PUT",headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Add ${n}`,content:content,sha:sha})});
      if(putRes.ok) document.getElementById('msg').innerText="✅ LIVE Hogaya! 1 min me sabko dikhega"; else document.getElementById('msg').innerText="❌ GitHub Error - local save hua";
    } else document.getElementById('msg').innerText="✅ Local save, token dalo to sabko LIVE hoga";
  }catch(e){document.getElementById('msg').innerText="Error: "+e.message;}
  document.getElementById('pName').value="";document.getElementById('pPrice').value="";document.getElementById('pCat').value="";document.getElementById('pv').innerHTML="";imgDatas=[]; render(); btn.innerText="✅ Save & Make LIVE (6 Photos)"; btn.disabled=false;
}

function render(){
  let list=gadgets.filter(g=>{let mCat=currentCat=='All'||(g.cat||'').toLowerCase().includes(currentCat.toLowerCase())||g.name.toLowerCase().includes(currentCat.toLowerCase()); let mSearch=g.name.toLowerCase().includes(searchQ); return mCat&&mSearch;});
  let box=document.getElementById('products'); if(list.length==0){box.innerHTML=`<div class="empty">No Products Found</div>`;return;}
  box.innerHTML=list.map(g=>{let realIdx=gadgets.indexOf(g); let imgs=g.imgs||[g.img]; let dots=imgs.length>1?`<div class="dots">${imgs.map((_,i)=>`<div class="dot ${i==0?'active':''}"></div>`).join('')}</div>`:'';
  return `<div class="card"><button class="card-del ${admin?'show':''}" onclick="delP(${realIdx})">✕</button><div class="card-img" onclick="openGallery(${realIdx},0)"><div class="card-badge">${imgs.length} PHOTOS</div><img src="${imgs[0]}">${dots}</div><div class="name">${g.name}</div><div class="price-row"><div><span class="price">Rs. ${g.price}</span><span class="old">Rs. ${Math.round(+g.price*1.4)}</span></div><button class="add-cart" onclick="addToCart(${realIdx})">+</button></div></div>`;}).join('');
}
function setCat(c,el){currentCat=c; document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active')); el.classList.add('active'); render();}
function filterProducts(){searchQ=document.getElementById('searchInput').value.toLowerCase(); render();}
async function delP(i){if(!confirm("Delete?")) return; gadgets.splice(i,1); localStorage.setItem('myGadgets',JSON.stringify(gadgets)); render(); let token=localStorage.getItem('gh_token'); if(!token) return; try{let shaRes=await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{headers:{Authorization:`token ${token}`}}); let sha=null; if(shaRes.ok){let j=await shaRes.json(); sha=j.sha;} let content=btoa(unescape(encodeURIComponent(JSON.stringify(gadgets,null,2)))); await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`,{method:"PUT",headers:{Authorization:`token ${token}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Delete`,content:content,sha:sha})});}catch(e){}}
function openGallery(idx,s){let g=gadgets[idx]; gList=g.imgs||[g.img]; gIndex=s; document.getElementById('gallery').classList.add('open'); showG();}
function showG(){document.getElementById('gMain').src=gList[gIndex]; document.getElementById('gCounter').innerText=`${gIndex+1} / ${gList.length}`; document.getElementById('gThumbs').innerHTML=gList.map((im,i)=>`<img src="${im}" class="${i==gIndex?'active':''}" onclick="event.stopPropagation(); gIndex=${i}; showG();">`).join('');}
function closeGallery(){document.getElementById('gallery').classList.remove('open');}
document.getElementById('gallery').addEventListener('click',e=>{if(e.target.id==='gMain'){gIndex=(gIndex+1)%gList.length; showG();}});

function addToCart(i){let ex=cart.find(c=>c.name===gadgets[i].name); if(ex) ex.qty++; else cart.push({...gadgets[i],qty:1,img:gadgets[i].imgs?gadgets[i].imgs[0]:gadgets[i].img}); localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0); document.getElementById('cartNum').innerText=cart.reduce((a,b)=>a+b.qty,0); let box=document.getElementById('cartItems'); if(cart.length==0){box.innerHTML=`<p style="text-align:center;color:#555;padding:40px">Cart Empty</p>`; document.getElementById('cartTotal').innerHTML=""; return;} box.innerHTML=cart.map((c,i)=>`<div class="cart-item"><img src="${c.img}"><div style="flex:1"><div style="font-size:12px">${c.name}</div><div style="font-size:12px;color:#00d4ff">Rs. ${c.price}</div><div class="qty"><button onclick="chgQty(${i},-1)">-</button><span>${c.qty}</span><button onclick="chgQty(${i},1)">+</button><button onclick="remCart(${i})" style="margin-left:10px;color:red;border:none;background:transparent">Remove</button></div></div></div>`).join(''); let total=cart.reduce((a,b)=>a+(+b.price*b.qty),0); document.getElementById('cartTotal').innerHTML=`<div style="display:flex;justify-content:space-between"><span>Total</span><span style="color:#00d4ff">Rs. ${total}</span></div><button onclick="checkout()" style="width:100%;padding:14px;background:#00d4ff;color:#000;border:none;border-radius:12px;font-weight:800;margin-top:14px">✅ Checkout via WhatsApp</button>`;}
function chgQty(i,d){cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function remCart(i){cart.splice(i,1); localStorage.setItem('myCart',JSON.stringify(cart)); updateCart();}
function openCart(){document.getElementById('cartDrawer').classList.add('open'); updateCart();}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');}
function checkout(){let total=cart.reduce((a,b)=>a+(+b.price*b.qty),0); let text=`*GadgetZone Order*%0A${cart.map(c=>`• ${c.name} x${c.qty}`).join('%0A')}%0ATotal Rs.${total}`; window.open(`https://wa.me/923256400449?text=${text}`,'_blank');}
loadProducts(); updateCart();
</script>
</body>
</html>
