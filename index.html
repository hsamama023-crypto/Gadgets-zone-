<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetZone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#000;color:white}
header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:10}
.logo{font-weight:700;font-size:20px;letter-spacing:0.5px}
.logo span{color:#00d4ff}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#111;border:1px solid #222;border-radius:18px;padding:12px;position:relative;transition:0.2s}
.card img{width:100%;height:145px;object-fit:contain;background:#0a0a0a;border-radius:14px;padding:10px}
.price{color:#00d4ff;font-weight:700;margin-top:6px;font-size:15px}
.name{font-size:12px;margin-top:8px;line-height:1.3;height:34px;overflow:hidden;color:#eee}
.btn{width:100%;padding:10px;border:none;border-radius:12px;margin-top:10px;font-weight:700;background:white;color:black}
.del{display:none;position:absolute;top:8px;right:8px;background:red;color:white;border:none;width:26px;height:26px;border-radius:50%}
.del.show{display:block}
#adminBar{display:none;background:red;color:white;text-align:center;padding:8px;font-size:11px}
#adminBar.show{display:block}
.empty{text-align:center;padding:80px 20px;color:#555;grid-column:1/3}
</style>
</head>
<body>

<div id="adminBar">🔓 DELETE MODE ON - Dubara Logo 5 bar dabao to band hoga</div>

<header>
<div class="logo" id="logoBtn">Gadget<span>Zone</span></div>
<div style="width:32px;height:32px;background:#1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center">🛒</div>
</header>

<div class="products" id="products"></div>

<script>
let gadgets = JSON.parse(localStorage.getItem('myGadgets') || '[]');
let tap=0, delMode=false;

document.getElementById('logoBtn').addEventListener('click',()=>{
  tap++;
  if(tap>=5){
    let p=prompt("🔒 Admin Password:");
    if(p==="gadgets 0827"){
      delMode=!delMode;
      document.getElementById('adminBar').classList.toggle('show',delMode);
      if(delMode) alert("✅ Delete ON - Ab X se delete kar sakte ho");
      render();
    }else if(p!==null){alert("❌ Ghalat Password");}
    tap=0;
  }
  setTimeout(()=>tap=0,3000);
});

function render(){
  let box=document.getElementById('products');
  if(gadgets.length===0){
    box.innerHTML=`<div class="empty">No<br>Products<br>Yet<br><br><span style="font-size:11px">Logo par 5 bar tap karo > Password > Product Add</span></div>`;
    return;
  }
  box.innerHTML=gadgets.map((g,i)=>`
    <div class="card">
      <button class="del ${delMode?'show':''}" onclick="delNow(${i})">X</button>
      <img src="${g.img}" onerror="this.src='https://via.placeholder.com/150'">
      <div class="name">${g.name}</div>
      <div class="price">Rs. ${g.price}</div>
      <button class="btn" onclick="window.open('https://wa.me/923000000000?text=Mujhe ${encodeURIComponent(g.name)} chahiye','_blank')">WhatsApp</button>
    </div>
  `).join('');
}
function delNow(i){
  if(confirm("Delete "+gadgets[i].name+" ?")){
    gadgets.splice(i,1);
    localStorage.setItem('myGadgets',JSON.stringify(gadgets));
    render();
  }
}
render();
</script>
</body>
</html>
